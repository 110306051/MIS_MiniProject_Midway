# 本機資料庫：在專案資料夾執行 `docker compose up -d`
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: midway
      POSTGRES_PASSWORD: midway
      POSTGRES_DB: midway
    ports:
      - "5432:5432"
    volumes:
      - midway-db:/var/lib/postgresql/data
volumes:
  midway-db:
